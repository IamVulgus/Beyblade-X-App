<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beyblade X - Match Scoreboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #060709;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    /* Glow Effects */
    .glow-cyan {
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35), inset 0 0 15px rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
    }
    .glow-orange {
      box-shadow: 0 0 25px rgba(255, 59, 0, 0.35), inset 0 0 15px rgba(255, 59, 0, 0.2);
      border-color: #ff3b00;
    }
    .text-glow-cyan {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }
    .text-glow-orange {
      text-shadow: 0 0 12px rgba(255, 59, 0, 0.8);
    }

    /* Screen Shake Animation */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(-1deg); }
      40% { transform: translate(3px, 2px) rotate(1deg); }
      60% { transform: translate(-1px, -1px) rotate(0deg); }
      80% { transform: translate(2px, 1px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .shake {
      animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Pulse scale for countdown */
    @keyframes pulse-zoom {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pulse-zoom {
      animation: pulse-zoom 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none bg-slate-950 text-white">

  <!-- APP CONTAINER (Landscape Flex Layout) -->
  <div id="app" class="h-full w-full flex relative">

    <!-- LATO SINISTRA: PLAYER 1 (CYAN) -->
    <div id="side-p1" class="w-1/2 h-full flex flex-col justify-between p-3 border-r-2 border-cyan-500/40 bg-gradient-to-br from-cyan-950/30 via-slate-950 to-slate-950 relative">
      <!-- Player Header -->
      <div class="flex justify-between items-center bg-slate-900/80 p-2 rounded-xl border border-cyan-500/30 glow-cyan">
        <div>
          <span class="text-xs text-cyan-400 font-bold tracking-widest block uppercase">PLAYER 1</span>
          <h2 id="disp-p1-name" class="text-xl font-black text-cyan-300 truncate max-w-[160px]">PLAYER 1</h2>
        </div>
        <div class="flex items-baseline space-x-1">
          <span class="text-xs text-slate-400">PTS:</span>
          <span id="disp-p1-score" class="text-4xl font-black text-cyan-400 text-glow-cyan leading-none">0</span>
        </div>
      </div>

      <!-- Main Action Buttons -->
      <div class="grid grid-cols-2 gap-2 my-auto">
        <button onclick="addScore(1, 1, 'Spin Finish')" class="py-3 px-2 bg-slate-900/90 hover:bg-cyan-950 border-2 border-cyan-500/60 rounded-xl text-cyan-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">SPIN FINISH</span>
          <span class="text-xs text-cyan-400 font-black">+1 PT</span>
        </button>
        <button onclick="addScore(1, 2, 'Burst')" class="py-3 px-2 bg-slate-900/90 hover:bg-cyan-950 border-2 border-cyan-500/60 rounded-xl text-cyan-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">BURST</span>
          <span class="text-xs text-cyan-400 font-black">+2 PTS</span>
        </button>
        <button onclick="addScore(1, 2, 'Over Finish')" class="py-3 px-2 bg-slate-900/90 hover:bg-cyan-950 border-2 border-cyan-500/60 rounded-xl text-cyan-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">OVER FINISH</span>
          <span class="text-xs text-cyan-400 font-black">+2 PTS</span>
        </button>
        <button onclick="addScore(1, 3, 'Extreme Finish')" class="py-3 px-2 bg-gradient-to-r from-cyan-600 to-blue-600 border-2 border-cyan-300 rounded-xl text-white font-black active:scale-95 transition-all shadow-xl flex flex-col items-center justify-center glow-cyan">
          <span class="text-xl leading-tight tracking-wider">EXTREME</span>
          <span class="text-xs text-cyan-200 font-black">+3 PTS</span>
        </button>
      </div>

      <!-- Controls: Foul & Undo -->
      <div class="flex gap-2">
        <button onclick="addFoul(1)" class="w-1/2 py-2 bg-amber-950/40 hover:bg-amber-900/60 border border-amber-600/50 rounded-lg text-amber-400 text-xs font-bold active:scale-95 transition-all flex items-center justify-center gap-1">
          <span>⚠️ FALLO</span>
          <span id="disp-p1-fouls" class="bg-amber-500/20 px-1.5 py-0.5 rounded text-[10px] text-amber-300">0/2</span>
        </button>
        <button onclick="undoLastAction()" class="w-1/2 py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 text-xs font-bold active:scale-95 transition-all flex items-center justify-center">
          ↩ CORREGGI
        </button>
      </div>
    </div>

    <!-- LATO DESTRA: PLAYER 2 (ORANGE/RED) -->
    <div id="side-p2" class="w-1/2 h-full flex flex-col justify-between p-3 border-l-2 border-orange-500/40 bg-gradient-to-bl from-orange-950/30 via-slate-950 to-slate-950 relative">
      <!-- Player Header -->
      <div class="flex justify-between items-center bg-slate-900/80 p-2 rounded-xl border border-orange-500/30 glow-orange">
        <div>
          <span class="text-xs text-orange-400 font-bold tracking-widest block uppercase">PLAYER 2</span>
          <h2 id="disp-p2-name" class="text-xl font-black text-orange-300 truncate max-w-[160px]">PLAYER 2</h2>
        </div>
        <div class="flex items-baseline space-x-1">
          <span class="text-xs text-slate-400">PTS:</span>
          <span id="disp-p2-score" class="text-4xl font-black text-orange-400 text-glow-orange leading-none">0</span>
        </div>
      </div>

      <!-- Main Action Buttons -->
      <div class="grid grid-cols-2 gap-2 my-auto">
        <button onclick="addScore(2, 1, 'Spin Finish')" class="py-3 px-2 bg-slate-900/90 hover:bg-orange-950 border-2 border-orange-500/60 rounded-xl text-orange-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">SPIN FINISH</span>
          <span class="text-xs text-orange-400 font-black">+1 PT</span>
        </button>
        <button onclick="addScore(2, 2, 'Burst')" class="py-3 px-2 bg-slate-900/90 hover:bg-orange-950 border-2 border-orange-500/60 rounded-xl text-orange-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">BURST</span>
          <span class="text-xs text-orange-400 font-black">+2 PTS</span>
        </button>
        <button onclick="addScore(2, 2, 'Over Finish')" class="py-3 px-2 bg-slate-900/90 hover:bg-orange-950 border-2 border-orange-500/60 rounded-xl text-orange-300 font-bold active:scale-95 transition-all shadow-lg flex flex-col items-center justify-center">
          <span class="text-lg leading-tight">OVER FINISH</span>
          <span class="text-xs text-orange-400 font-black">+2 PTS</span>
        </button>
        <button onclick="addScore(2, 3, 'Extreme Finish')" class="py-3 px-2 bg-gradient-to-r from-orange-600 to-red-600 border-2 border-orange-300 rounded-xl text-white font-black active:scale-95 transition-all shadow-xl flex flex-col items-center justify-center glow-orange">
          <span class="text-xl leading-tight tracking-wider">EXTREME</span>
          <span class="text-xs text-orange-200 font-black">+3 PTS</span>
        </button>
      </div>

      <!-- Controls: Foul & Undo -->
      <div class="flex gap-2">
        <button onclick="addFoul(2)" class="w-1/2 py-2 bg-amber-950/40 hover:bg-amber-900/60 border border-amber-600/50 rounded-lg text-amber-400 text-xs font-bold active:scale-95 transition-all flex items-center justify-center gap-1">
          <span>⚠️ FALLO</span>
          <span id="disp-p2-fouls" class="bg-amber-500/20 px-1.5 py-0.5 rounded text-[10px] text-amber-300">0/2</span>
        </button>
        <button onclick="undoLastAction()" class="w-1/2 py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 text-xs font-bold active:scale-95 transition-all flex items-center justify-center">
          ↩ CORREGGI
        </button>
      </div>
    </div>


    <!-- OVERLAY 1: SETUP SCREEN (INSERIMENTO NICKNAME E READY CHECK) -->
    <div id="modal-setup" class="absolute inset-0 bg-slate-950 z-40 flex">
      <!-- P1 Setup (Left) -->
      <div class="w-1/2 h-full p-6 flex flex-col justify-center items-center border-r border-cyan-500/30 bg-cyan-950/10">
        <h3 class="text-cyan-400 font-black text-xl mb-3 tracking-widest">GIOCATORE SINISTRA</h3>
        <input type="text" id="input-p1-name" placeholder="Nickname P1" value="Blader 1" maxlength="12" class="w-full max-w-xs p-3 text-center bg-slate-900 border-2 border-cyan-500/50 rounded-xl text-cyan-300 font-bold focus:outline-none focus:border-cyan-400 mb-4 text-lg">
        <button id="btn-p1-ready" onclick="toggleReady(1)" class="w-full max-w-xs py-4 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black rounded-xl text-2xl tracking-wider transition-all shadow-lg glow-cyan active:scale-95">
          PRONTO
        </button>
      </div>

      <!-- P2 Setup (Right) -->
      <div class="w-1/2 h-full p-6 flex flex-col justify-center items-center border-l border-orange-500/30 bg-orange-950/10">
        <h3 class="text-orange-400 font-black text-xl mb-3 tracking-widest">GIOCATORE DESTRA</h3>
        <input type="text" id="input-p2-name" placeholder="Nickname P2" value="Blader 2" maxlength="12" class="w-full max-w-xs p-3 text-center bg-slate-900 border-2 border-orange-500/50 rounded-xl text-orange-300 font-bold focus:outline-none focus:border-orange-400 mb-4 text-lg">
        <button id="btn-p2-ready" onclick="toggleReady(2)" class="w-full max-w-xs py-4 bg-orange-600 hover:bg-orange-500 text-slate-950 font-black rounded-xl text-2xl tracking-wider transition-all shadow-lg glow-orange active:scale-95">
          PRONTO
        </button>
      </div>
    </div>


    <!-- OVERLAY 2: COUNTDOWN ANIMATION -->
    <div id="modal-countdown" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center">
      <div id="countdown-text" class="text-7xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-white to-orange-500 tracking-wider">
        3
      </div>
    </div>


    <!-- OVERLAY 3: WINNER CELEBRATION -->
    <div id="modal-winner" class="hidden absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center">
      <div class="text-cyan-400 text-sm font-bold tracking-widest uppercase mb-2">RISULTATO FINALE</div>
      <h1 id="winner-text" class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-yellow-300 to-orange-500 mb-6 drop-shadow-lg">
        BLADER 1 WIN!
      </h1>
      <button onclick="fullReset()" class="px-8 py-4 bg-gradient-to-r from-cyan-500 to-orange-500 text-slate-950 font-black text-2xl rounded-2xl shadow-2xl hover:scale-105 active:scale-95 transition-all">
        🔄 NUOVO MATCH
      </button>
    </div>

  </div>

  <!-- JS LOGIC -->
  <script>
    // App State
    let state = {
      p1Name: 'Blader 1',
      p2Name: 'Blader 2',
      p1Score: 0,
      p2Score: 0,
      p1Fouls: 0,
      p2Fouls: 0,
      p1Ready: false,
      p2Ready: false
    };

    // History stack for Undo
    let historyStack = [];

    // Save state snapshot for undo
    function saveHistory() {
      historyStack.push(JSON.parse(JSON.stringify(state)));
    }

    // Voice Synthesis Helper
    function speak(text, pitch = 1.1, rate = 1.15) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Interrupt ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'it-IT';
        utterance.pitch = pitch;
        utterance.rate = rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Ready Check Logic
    function toggleReady(player) {
      if (player === 1) {
        state.p1Ready = !state.p1Ready;
        const btn = document.getElementById('btn-p1-ready');
        if (state.p1Ready) {
          btn.innerText = 'PRONTO!';
          btn.classList.add('bg-emerald-500', 'text-slate-950');
        } else {
          btn.innerText = 'PRONTO';
          btn.classList.remove('bg-emerald-500');
        }
      } else if (player === 2) {
        state.p2Ready = !state.p2Ready;
        const btn = document.getElementById('btn-p2-ready');
        if (state.p2Ready) {
          btn.innerText = 'PRONTO!';
          btn.classList.add('bg-emerald-500', 'text-slate-950');
        } else {
          btn.innerText = 'PRONTO';
          btn.classList.remove('bg-emerald-500');
        }
      }

      // If both ready -> Start countdown
      if (state.p1Ready && state.p2Ready) {
        state.p1Name = document.getElementById('input-p1-name').value.trim() || 'Blader 1';
        state.p2Name = document.getElementById('input-p2-name').value.trim() || 'Blader 2';
        updateDisplay();
        startCountdown();
      }
    }

    // Countdown Sequence
    function startCountdown() {
      document.getElementById('modal-setup').classList.add('hidden');
      const modal = document.getElementById('modal-countdown');
      const textEl = document.getElementById('countdown-text');
      modal.classList.remove('hidden');

      const steps = [
        { text: '3', speak: '3' },
        { text: '2', speak: '2' },
        { text: '1', speak: '1' },
        { text: 'PRONTI...', speak: 'Pronti' },
        { text: 'LANCIO!', speak: 'LANCIO!' }
      ];

      let index = 0;

      function runStep() {
        if (index < steps.length) {
          textEl.innerText = steps[index].text;
          textEl.classList.remove('animate-pulse-zoom');
          void textEl.offsetWidth; // Trigger reflow for animation restart
          textEl.classList.add('animate-pulse-zoom');
          
          speak(steps[index].speak, 1.2, 1.2);
          index++;
          setTimeout(runStep, 900);
        } else {
          modal.classList.add('hidden');
        }
      }

      runStep();
    }

    // Add Score
    function addScore(player, points, finishName) {
      saveHistory();
      
      // Reset fouls on any point scored
      state.p1Fouls = 0;
      state.p2Fouls = 0;

      if (player === 1) {
        state.p1Score += points;
      } else {
        state.p2Score += points;
      }

      updateDisplay();
      triggerScreenShake();
      speak(finishName + "!");

      checkWinCondition();
    }

    // Add Foul Logic
    function addFoul(player) {
      saveHistory();

      if (player === 1) {
        state.p1Fouls++;
        if (state.p1Fouls >= 2) {
          // 2 consecutive fouls -> point to opponent
          state.p1Fouls = 0;
          state.p2Score += 1;
          speak(`Fallo! Punto a ${state.p2Name}`);
        } else {
          speak("Fallo!");
        }
      } else {
        state.p2Fouls++;
        if (state.p2Fouls >= 2) {
          state.p2Fouls = 0;
          state.p1Score += 1;
          speak(`Fallo! Punto a ${state.p1Name}`);
        } else {
          speak("Fallo!");
        }
      }

      updateDisplay();
      checkWinCondition();
    }

    // Undo Action
    function undoLastAction() {
      if (historyStack.length > 0) {
        state = historyStack.pop();
        updateDisplay();
        speak("Annullato");
      }
    }

    // Check Victory (Target >= 4 pts)
    function checkWinCondition() {
      if (state.p1Score >= 4 || state.p2Score >= 4) {
        let winnerName = "";
        if (state.p1Score >= 4 && state.p1Score > state.p2Score) {
          winnerName = state.p1Name;
        } else if (state.p2Score >= 4 && state.p2Score > state.p1Score) {
          winnerName = state.p2Name;
        }

        if (winnerName !== "") {
          setTimeout(() => {
            document.getElementById('winner-text').innerText = `${winnerName.toUpperCase()} WIN!`;
            document.getElementById('modal-winner').classList.remove('hidden');
            speak(`${winnerName} win!`, 1.2, 1.0);
          }, 400);
        }
      }
    }

    // Reset All back to setup
    function fullReset() {
      state = {
        p1Name: 'Blader 1',
        p2Name: 'Blader 2',
        p1Score: 0,
        p2Score: 0,
        p1Fouls: 0,
        p2Fouls: 0,
        p1Ready: false,
        p2Ready: false
      };
      historyStack = [];

      document.getElementById('btn-p1-ready').innerText = 'PRONTO';
      document.getElementById('btn-p1-ready').classList.remove('bg-emerald-500');
      document.getElementById('btn-p2-ready').innerText = 'PRONTO';
      document.getElementById('btn-p2-ready').classList.remove('bg-emerald-500');

      document.getElementById('modal-winner').classList.add('hidden');
      document.getElementById('modal-setup').classList.remove('hidden');

      updateDisplay();
    }

    // Update UI elements from State
    function updateDisplay() {
      document.getElementById('disp-p1-name').innerText = state.p1Name;
      document.getElementById('disp-p2-name').innerText = state.p2Name;

      document.getElementById('disp-p1-score').innerText = state.p1Score;
      document.getElementById('disp-p2-score').innerText = state.p2Score;

      document.getElementById('disp-p1-fouls').innerText = `${state.p1Fouls}/2`;
      document.getElementById('disp-p2-fouls').innerText = `${state.p2Fouls}/2`;
    }

    // Visual feedback effect
    function triggerScreenShake() {
      const app = document.getElementById('app');
      app.classList.remove('shake');
      void app.offsetWidth;
      app.classList.add('shake');
    }

    // Init
    updateDisplay();
  </script>
</body>
</html>
